<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendor Login | KisanSetu</title>


    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link rel="stylesheet" href="css/login.css">

</head>


<body class="vendor-page">


    <div class="login-page">


        <!-- LEFT -->

        <div class="login-left">

            <a href="index.html" class="login-logo">

                <span class="logo-icon">
                🌱
            </span> Kisan

                <span>Setu</span>

            </a>


            <p class="login-tagline">
                Smart Farming • Better Decisions • Brighter Tomorrow
            </p>


            <div class="login-image">

                <img src="assets/images/vendor-login.png" alt="Vendor">

            </div>


            <div class="role-title">

                <span>Vendor</span> Login

            </div>


            <p class="role-description">

                Manage products, connect with farmers and grow your business.

            </p>

        </div>



        <!-- RIGHT -->

        <div class="login-right">


            <div class="login-card">


                <div class="mobile-logo">

                    🌱

                    <strong>
                    Kisan<span>Setu</span>
                </strong>

                </div>


                <div class="welcome-text">

                    <h1>
                        Welcome, Vendor 👋
                    </h1>

                    <p>
                        Login to manage your market activities
                    </p>

                </div>



                <!-- EMAIL / MOBILE -->

                <div class="input-group">

                    <label>
                    Email or Mobile Number
                </label>

                    <div class="input-box">

                        <i class="bi bi-person"></i>

                        <input type="text" placeholder="Enter your email or mobile number">

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                    Password
                </label>

                    <div class="input-box">

                        <i class="bi bi-lock"></i>

                        <input type="password" id="vendorPassword" placeholder="Enter your password">

                        <button type="button" class="password-toggle" onclick="togglePassword('vendorPassword', this)">

                        <i class="bi bi-eye"></i>

                    </button>

                    </div>

                </div>



                <div class="forgot-row">

                    <a href="#">
                    Forgot Password?
                </a>

                </div>



                <button class="login-submit">

                Login

                <i class="bi bi-arrow-right"></i>

            </button>



                <p class="signup-text">

                    Don't have an account?

                    <a href="#">
                    Register as Vendor
                </a>

                </p>



                <a href="index.html" class="back-home">

                    <i class="bi bi-arrow-left"></i> Back to Home

                </a>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
